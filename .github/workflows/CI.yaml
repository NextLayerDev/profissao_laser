name: 🚀 CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_VERSION: "24"

env:
  NODE_VERSION: "24"
  # `.npmrc` já manda o escopo @upvox-dev pro GitHub Packages; falta só o
  # token, que não pode ir pro arquivo versionado. GITHUB_TOKEN não serve
  # aqui — @upvox-dev/ui vive no repo UpVox-Dev/upvox-ui, outra org, e o
  # GITHUB_TOKEN de um workflow não enxerga pacotes fora do seu próprio
  # org/repo. Precisa de um PAT (classic, escopo `read:packages`) de uma
  # conta com acesso à UpVox-Dev, salvo aqui como secret UPVOX_UI_PACKAGES_TOKEN.
  NODE_AUTH_TOKEN: ${{ secrets.UPVOX_UI_PACKAGES_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@upvox-dev"
      - name: 📦 Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@upvox-dev"
      - run: npm ci
      - name: 린 Lint check
        run: npx biome check .
      - name: ✅ Type check
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@upvox-dev"
      - run: npm ci
      - name: 🏗️ Build application
        run: npm run build

  security:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@upvox-dev"
      - run: npm ci
      - name: 🔒 Run NPM Audit
        run: npm audit --audit-level=critical

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push'
    steps:
      - name: 🚀 Deploy to EasyPanel (main)
        if: github.ref_name == 'main'
        run: curl -s -X GET "${{ secrets.EASYPANEL_DEPLOY_MAIN }}"

      - name: 🚀 Deploy to EasyPanel (dev)
        if: github.ref_name == 'dev'
        run: curl -s -X GET "${{ secrets.EASYPANEL_DEPLOY_DEV }}"
